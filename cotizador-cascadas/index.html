<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador - Cascadas Hotel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --oscuro: #3E3E40;
      --dorado: #C3AE8F;
      --gris: #f2f0ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Calibri, Arial, sans-serif;
      background: var(--gris);
      color: #2b2b2b;
    }
    header.app {
      background: var(--oscuro);
      color: var(--dorado);
      padding: 14px 22px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    header.app h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
    header.app span { font-size: 12px; color: #cfcabf; }
    .layout {
      display: flex;
      gap: 18px;
      padding: 18px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 18px;
      flex: 1 1 420px;
      max-width: 560px;
    }
    .previewWrap {
      flex: 2 1 560px;
      min-width: 320px;
    }
    .previewScroll {
      background: #d8d5cf;
      border-radius: 10px;
      padding: 16px;
      overflow: auto;
      max-height: 82vh;
      box-shadow: inset 0 1px 4px rgba(0,0,0,.15);
    }
    h2.seccion {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--oscuro);
      border-bottom: 2px solid var(--dorado);
      padding-bottom: 5px;
      margin: 20px 0 10px;
    }
    h2.seccion:first-of-type { margin-top: 0; }
    label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 3px; }
    input, select {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
    }
    .fila { display: flex; gap: 8px; margin-bottom: 8px; }
    .fila > div { flex: 1; }
    .fila > div.chica { flex: 0 0 64px; }
    .fila > div.media { flex: 0 0 118px; }
    .fila > div.boton { flex: 0 0 34px; display: flex; align-items: flex-end; }
    .tipoBtns { display: flex; gap: 8px; margin-bottom: 6px; }
    .tipoBtns button {
      flex: 1;
      padding: 9px;
      border: 1.5px solid var(--oscuro);
      background: #fff;
      color: var(--oscuro);
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    .tipoBtns button.activo { background: var(--oscuro); color: var(--dorado); }
    button.mini {
      background: #fff;
      border: 1px solid #bbb;
      color: #a33;
      border-radius: 6px;
      width: 30px;
      height: 32px;
      cursor: pointer;
      font-size: 15px;
    }
    button.agregar {
      background: none;
      border: 1px dashed var(--oscuro);
      color: var(--oscuro);
      border-radius: 6px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 2px;
    }
    .incluye {
      font-size: 12px;
      background: #f6f2ea;
      border: 1px solid var(--dorado);
      border-radius: 6px;
      padding: 7px 10px;
      margin-top: 6px;
      color: #5a4f3d;
      display: none;
    }
    .totales {
      background: var(--oscuro);
      color: #eee;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 14px;
    }
    .totales div { display: flex; justify-content: space-between; padding: 2px 0; }
    .totales .final { font-size: 17px; font-weight: 800; color: var(--dorado); border-top: 1px solid #666; margin-top: 5px; padding-top: 6px; }
    .acciones { margin-top: 14px; display: flex; gap: 10px; }
    .acciones button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    #btnPdf { background: var(--dorado); color: var(--oscuro); }
    #btnPdf:disabled { opacity: .55; cursor: wait; }
    #estado { margin-top: 10px; font-size: 12.5px; min-height: 18px; }
    #estado a { color: #2c6e49; font-weight: 700; }
    #estado.error { color: #b00020; }

    /* =========================================================
       DOCUMENTO (vista previa = PDF). Formato del Word manual.
       Ancho fijo 794px = A4 a 96dpi. NO cambiar sin ajustar PDF.
       ========================================================= */
    #docArea {
      width: 794px;
      background: #fff;
      margin: 0 auto;
      font-family: Aptos, Calibri, 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      color: #000;
      line-height: 1.45;
    }
    #docArea .banner { display: block; width: 100%; }
    #docArea .cuerpo { padding: 26px 68px 30px; }
    #docArea .fechaDoc { text-align: right; margin: 0 0 26px; }
    #docArea p { margin: 0 0 12px; }
    #docArea ul { margin: 0 0 12px; padding-left: 26px; }
    #docArea li { margin-bottom: 4px; }
    #docArea .tituloSec { font-weight: 700; margin: 20px 0 8px; }
    #docArea .horarios { display: flex; gap: 30px; margin: 4px 0 14px; }
    #docArea .horarios > div { flex: 1; }
    #docArea .horarios .dia { font-weight: 700; text-decoration: underline; margin-bottom: 4px; }
    #docArea .footerDoc {
      border-top: 3px solid var(--oscuro);
      margin-top: 26px;
      padding: 10px 0 4px;
      text-align: center;
      font-size: 11.5px;
      color: #444;
    }

    /* --- LA TABLA: una sola, transparente, igual al Word --- */
    table.tablaCot {
      border-collapse: collapse;
      width: 100%;
      margin: 6px 0 16px;
      font-size: 12.5px;
      background: transparent;
    }
    table.tablaCot th, table.tablaCot td {
      border: 1px solid #000;
      padding: 5px 6px;
      background: transparent;
      vertical-align: middle;
      text-align: center;
    }
    table.tablaCot th { font-weight: 700; }
    table.tablaCot td.izq, table.tablaCot th.izq { text-align: left; }
    /* Celdas invisibles junto a Subtotal / IVA / Total (sin borde, como en Word) */
    table.tablaCot td.vacia { border: none; background: transparent; }
    table.tablaCot tr.totalFila td { font-weight: 700; }
    table.tablaCot .subDetalle { font-size: 10.5px; color: #333; font-weight: 400; }

    @media (max-width: 900px) {
      .previewScroll { max-height: none; }
    }
  </style>
</head>
<body>
  <header class="app">
    <h1>CASCADAS HOTEL</h1>
    <span>Cotizador de reservas</span>
  </header>

  <div class="layout">
    <!-- ==================== FORMULARIO ==================== -->
    <div class="panel">
      <h2 class="seccion">Cliente</h2>
      <div class="fila">
        <div class="media">
          <label>Tratamiento</label>
          <select id="tratamiento">
            <option>Estimada</option>
            <option>Estimado</option>
            <option>Estimados</option>
          </select>
        </div>
        <div>
          <label>Nombre del pasajero</label>
          <input type="text" id="cliente" placeholder="Ej: Alejandra Pérez">
        </div>
      </div>

      <h2 class="seccion">Tipo de cotización</h2>
      <div class="tipoBtns">
        <button type="button" id="btnEstandar" class="activo" onclick="setTipo('Estándar')">Estándar</button>
        <button type="button" id="btnPrograma" onclick="setTipo('Programa')">Programa</button>
      </div>

      <!-- ESTÁNDAR: habitaciones -->
      <div id="secEstandar">
        <h2 class="seccion">Habitaciones</h2>
        <div id="listaHabitaciones"></div>
        <button type="button" class="agregar" onclick="agregarHabitacion()">+ Agregar habitación</button>
      </div>

      <!-- PROGRAMA -->
      <div id="secPrograma" style="display:none">
        <h2 class="seccion">Programa</h2>
        <div class="fila">
          <div>
            <label>Programa</label>
            <select id="programaSel" onchange="refrescar()"></select>
          </div>
          <div class="chica">
            <label>Cant.</label>
            <input type="number" id="programaCant" value="1" min="1" onchange="refrescar()">
          </div>
        </div>
        <div class="fila">
          <div>
            <label>Check-In</label>
            <input type="date" id="programaIn" onchange="refrescar()">
          </div>
          <div>
            <label>Check-Out</label>
            <input type="date" id="programaOut" onchange="refrescar()">
          </div>
        </div>
        <div class="incluye" id="programaIncluye"></div>
      </div>

      <h2 class="seccion">Amenidades / extras</h2>
      <div id="listaExtras"></div>
      <button type="button" class="agregar" onclick="agregarExtra()">+ Agregar amenidad o ítem</button>

      <div class="totales">
        <div><span>Subtotal (neto)</span><span id="tSub">$0</span></div>
        <div><span>IVA 19%</span><span id="tIva">$0</span></div>
        <div class="final"><span>Total</span><span id="tTotal">$0</span></div>
      </div>

      <div class="acciones">
        <button type="button" id="btnPdf" onclick="descargarPDF()">Descargar PDF y guardar</button>
      </div>
      <div id="estado"></div>
    </div>

    <!-- ==================== VISTA PREVIA / PDF ==================== -->
    <div class="previewWrap">
      <div class="previewScroll">
        <div id="docArea"><!-- se genera con JS --></div>
      </div>
    </div>
  </div>

  return '$' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function fechaLarga(d) {
  return d.getDate() + ' de ' + MESES[d.getMonth()] + ' del ' + d.getFullYear();
}
function ddmmyyyy(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function noches(inIso, outIso) {
  if (!inIso || !outIso) return 0;
  var n = Math.round((new Date(outIso) - new Date(inIso)) / 86400000);
  return n > 0 ? n : 0;
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ================= CÁLCULO DE LÍNEAS =================
// Devuelve {lineas:[{nombre, sub, cant, checkIn, checkOut, noches, unit, neto}], rangoIn, rangoOut}
function calcularLineas() {
  var lineas = [];
  var rangoIn = '', rangoOut = '';

  if (tipo === 'Estándar') {
    document.querySelectorAll('#listaHabitaciones .habFila').forEach(function (f) {
      var idx = Number(f.querySelector('.habSel').value);
      var t = CFG.tarifas[idx];
      if (!t) return;
      var cant = Math.max(1, Number(f.querySelector('.habCant').value) || 1);
      var ci = f.querySelector('.habIn').value;
      var co = f.querySelector('.habOut').value;
      var n = noches(ci, co);
      lineas.push({
        nombre: t.nombre, sub: '', cant: cant,
        checkIn: ci, checkOut: co, noches: n,
        unit: t.precio, neto: t.precio * cant * n
      });
      if (ci && (!rangoIn || ci < rangoIn)) rangoIn = ci;
      if (co && (!rangoOut || co > rangoOut)) rangoOut = co;
    });
  } else {
    var sel = document.getElementById('programaSel');
    var p = CFG.programas[Number(sel.value)];
    if (p) {
      var cantP = Math.max(1, Number(document.getElementById('programaCant').value) || 1);
      var ciP = document.getElementById('programaIn').value;
      var coP = document.getElementById('programaOut').value;
      lineas.push({
        nombre: 'Programa ' + p.nombre, sub: describirTicks(p.ticks), cant: cantP,
        checkIn: ciP, checkOut: coP, noches: noches(ciP, coP),
        unit: p.precio, neto: p.precio * cantP
      });
      rangoIn = ciP; rangoOut = coP;
    }
  }

  // Extras: usan las fechas de la estadía como referencia (como en el Word manual)
  document.querySelectorAll('#listaExtras .extraBloque').forEach(function (b) {
    var sel = b.querySelector('.extSel');
    var cant = Math.max(1, Number(b.querySelector('.extCant').value) || 1);
    var nombre, precio;
    if (sel.value === 'custom') {
      nombre = b.querySelector('.extNombre').value.trim();
      precio = Number(b.querySelector('.extPrecio').value) || 0;
      if (!nombre) return;
    } else {
      var a = CFG.amenidades[Number(sel.value)];
      if (!a) return;
      nombre = a.nombre;
      precio = a.precio;
    }
    lineas.push({
      nombre: nombre, sub: '', cant: cant,
      checkIn: rangoIn, checkOut: rangoOut, noches: null,
      unit: precio, neto: precio * cant
    });
  });

  return { lineas: lineas, rangoIn: rangoIn, rangoOut: rangoOut };
}

function describirTicks(ticks) {
  if (!ticks) return '';
  var partes = [];
  var mapaServ = { tinaja: 'sesión de tinaja', drinks: 'welcome drink' };
  (ticks.servicios || []).forEach(function (s) { partes.push(mapaServ[s] || s); });
  if (Number(ticks.almuerzos) > 0) partes.push(ticks.almuerzos + ' almuerzo' + (ticks.almuerzos > 1 ? 's' : ''));
  if (Number(ticks.cenas) > 0) partes.push(ticks.cenas + ' cena' + (ticks.cenas > 1 ? 's' : ''));
  if (Number(ticks.masajes) > 0) partes.push(ticks.masajes + ' masaje' + (ticks.masajes > 1 ? 's' : ''));
  if (Number(ticks.ocasionesEspeciales) > 0) partes.push(ticks.ocasionesEspeciales + ' ocasión especial');
  return partes.length ? 'Incluye: ' + partes.join(', ') : '';
}

// ================= GENERAR PDF (una sola hoja larga) =================
function descargarPDF() {
  var estado = document.getElementById('estado');
  estado.className = '';
  var cliente = document.getElementById('cliente').value.trim();
  if (!cliente) {
    estado.className = 'error';
    estado.textContent = 'Escribe el nombre del pasajero antes de generar el PDF.';
    return;
  }
  var r = calcularLineas();
  if (!r.lineas.length) {
    estado.className = 'error';
    estado.textContent = 'Agrega al menos una habitación, programa o amenidad.';
    return;
  }
  var lineasSinFecha = r.lineas.filter(function (l) { return l.noches !== null && (!l.checkIn || !l.checkOut || l.noches === 0); });
  if (tipo === 'Estándar' && lineasSinFecha.length) {
    estado.className = 'error';
    estado.textContent = 'Revisa las fechas: el check-out debe ser posterior al check-in en todas las habitaciones.';
    return;
  }
  if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
    estado.className = 'error';
    estado.textContent = 'No cargaron las librerías de PDF. Revisa tu conexión y recarga la página.';
    return;
  }

  refrescar();
  var btn = document.getElementById('btnPdf');
  btn.disabled = true;
  btn.textContent = 'Generando PDF…';
  estado.textContent = '';

  var doc = document.getElementById('docArea');

  html2canvas(doc, { scale: 2, backgroundColor: '#ffffff', logging: false }).then(function (canvas) {
    // Una sola página con el alto exacto del contenido (hoja larga)
    var anchoPt = 595.28; // ancho A4 en puntos
    var altoPt = canvas.height * anchoPt / canvas.width;
    var pdf = new window.jspdf.jsPDF({ orientation: 'p', unit: 'pt', format: [anchoPt, altoPt] });
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, anchoPt, altoPt);

    var hoy = new Date();
    var fechaArchivo = ('0' + hoy.getDate()).slice(-2) + ('0' + (hoy.getMonth() + 1)).slice(-2) + hoy.getFullYear();
    var nombreArchivo = 'Cotizacion_Cascadas_Hotel_' + cliente.replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g, '_') + '_' + fechaArchivo + '.pdf';

    pdf.save(nombreArchivo); // descarga inmediata para el usuario

    // Guardar copia en Drive + registrar en Historial
    var sub = r.lineas.reduce(function (acc, l) { return acc + l.neto; }, 0);
    var payload = {
      cliente: cliente,
      tipo: tipo,
      nombreArchivo: nombreArchivo,
      pdfBase64: pdf.output('datauristring').split(',')[1],
      lineas: r.lineas.map(function (l) {
        return {
          detalle: l.nombre + (l.cant > 1 ? ' x' + l.cant : ''),
          checkIn: l.checkIn ? ddmmyyyy(l.checkIn) : '',
          checkOut: l.checkOut ? ddmmyyyy(l.checkOut) : '',
          noches: l.noches === null ? 0 : l.noches,
          neto: l.neto,
          total: Math.round(l.neto * 1.19)
        };
      })
    };

    estado.textContent = 'PDF descargado. Guardando copia en Drive…';

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      // modo prueba fuera de Apps Script: no hay servidor donde guardar
      btn.disabled = false;
      btn.textContent = 'Descargar PDF y guardar';
      estado.textContent = 'PDF descargado (modo prueba: sin guardado en Drive).';
      return;
    }

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.textContent = 'Descargar PDF y guardar';
        if (res && res.ok) {
          estado.innerHTML = '✅ Guardado en Historial' + (res.url ? ' — <a href="' + res.url + '" target="_blank">ver PDF en Drive</a>' : '');
        } else {
          estado.className = 'error';
          estado.textContent = 'El PDF se descargó, pero no se pudo guardar en Drive: ' + (res && res.error ? res.error : 'error desconocido');
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = 'Descargar PDF y guardar';
        estado.className = 'error';
        estado.textContent = 'El PDF se descargó, pero falló el guardado: ' + err;
      })
      .guardarCotizacion(payload);
  }).catch(function (err) {
    btn.disabled = false;
    btn.textContent = 'Descargar PDF y guardar';
    estado.className = 'error';
    estado.textContent = 'Error generando el PDF: ' + err;
  });
}
