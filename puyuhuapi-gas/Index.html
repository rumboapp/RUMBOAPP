<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puyuhuapi Lodge · Animaciones</title>
<style>
:root{
  --bg:#f3f5f2; --card:#fff; --ink:#1c2a27; --muted:#63726e; --line:#dde3df;
  --pri:#1f5f55; --pri2:#e3efec; --acc:#c2703d;
  --err:#b3261e; --errbg:#fdecea; --warn:#8a5a00; --warnbg:#fff4d6; --ok:#2e7d4f; --okbg:#e5f4ea;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.del{color:var(--err);border-color:#e8b9b5}
button.del.sure{background:var(--err);color:#fff}
button.sm{padding:3px 8px;font-size:13px}
button.link{border:0;background:none;color:var(--pri);padding:2px 4px;text-decoration:underline}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
label>input,label>select,label>textarea{margin-top:3px;font-size:15px;color:var(--ink)}
h1,h2,h3{margin:0}
h2{font-size:20px;margin:6px 0 12px}
h2::first-letter,.list-h::first-letter{text-transform:uppercase}
h3{font-size:15px;margin-bottom:8px}
small,.muted{color:var(--muted)}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;font-weight:600;flex:1}
header h1 span{opacity:.75;font-weight:400}
header small{color:rgba(255,255,255,.85)}
header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:4}
nav button{border:0;white-space:nowrap;border-radius:20px;padding:6px 14px}
nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
main{padding:16px 24px 60px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.bar input[type=date]{width:auto}
.bar select,.bar input[type=search]{width:auto;min-width:130px}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 10px;font-size:13px;border:1px solid var(--line);background:#fff}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#eef1ef;color:var(--muted);vertical-align:middle;font-weight:600}
.b-Confirmada{background:#dcebff;color:#1a4d8f}.b-Realizada{background:var(--okbg);color:var(--ok)}.b-Cancelada{background:#eee;color:#888;text-decoration:line-through}
.ex{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ex:hover{box-shadow:0 2px 8px rgba(0,0,0,.07)}
.ex.cancel{opacity:.55}
.ex .hora{font-weight:700;min-width:48px;font-variant-numeric:tabular-nums}
.ex .hora small{display:block;font-weight:400}
.ex .body{flex:1;min-width:0}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.alert{font-size:13px;border-radius:6px;padding:3px 8px;margin-top:4px}
.alert.err{background:var(--errbg);color:var(--err)}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.info{background:#eef4ff;color:#244a86}
.empty{color:var(--muted);text-align:center;padding:26px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.sem th.dh{cursor:pointer;text-align:center}
.sem td.c{min-width:112px;text-align:center;border-left:1px solid var(--line)}
.sem td.c.ed{cursor:pointer}
.sem td.c.ed:hover{outline:2px solid var(--pri);outline-offset:-2px}
.sem td.hoy,.sem th.hoy{background:#f5fbf9}
.sem tr.yo td{background:#fffbef}
.turno{display:block;border-radius:6px;padding:3px 4px;font-size:13px;font-weight:600}
.turno small{display:block;font-weight:400;color:#445}
.sem td.c.sel,.mes td.c.sel{background:#cfe6df!important;box-shadow:inset 0 0 0 2px var(--pri)}
.sel-modo td.c.ed{cursor:cell}
table.sem,table.mes{user-select:none;-webkit-user-select:none}
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:15;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);padding:10px 12px;display:none;max-width:calc(100% - 24px);width:max-content}
#selbar.on{display:block}
#selbar .row{flex-wrap:wrap;gap:6px}
#selbar b{margin-right:4px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 230px);min-height:420px}
.cal-head,.cal-body{display:grid}
.cal-head{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line)}
.cal-head .dh{padding:8px 6px;text-align:center;border-left:1px solid var(--line);line-height:1.2}
.cal-head .dh[data-a]{cursor:pointer}
.cal-head .dh[data-a]:hover{background:var(--pri2)}
.cal-head .dh b{display:block;font-size:13px}
.cal-head .dh small{font-size:11px}
.cal-head .dh.hoy{background:var(--pri2);color:var(--pri)}
.cal-head .gut{position:sticky;left:0;background:var(--card);z-index:4}
.cal-body{position:relative}
.cal-body .gut{position:sticky;left:0;z-index:2;background:var(--card);border-right:1px solid var(--line)}
.cal-body .gut span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-body .gut span:first-child{transform:none}
.cal .col{position:relative;border-left:1px solid var(--line);cursor:copy;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--pph)/2 - 1px),#f1f4f2 calc(var(--pph)/2 - 1px),#f1f4f2 calc(var(--pph)/2),transparent calc(var(--pph)/2),transparent calc(var(--pph) - 1px),var(--line) calc(var(--pph) - 1px),var(--line) var(--pph))}
.cal .col.hoy{background-color:#f7fbfa}
.burb{position:absolute;border-left:4px solid var(--pri);border-radius:8px;padding:4px 7px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:1px;background-clip:padding-box;outline:1px solid rgba(255,255,255,.9)}
.burb:hover{z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.burb b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#34443f}
.burb .x{color:var(--err);font-weight:600}
.burb.mal{box-shadow:0 0 0 2px var(--err)}
.burb.cancel{opacity:.45;text-decoration:line-through}
.ahora{position:absolute;left:0;right:0;border-top:2px solid var(--err);z-index:4;pointer-events:none}
.ahora::before{content:'';position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--err)}
.mini{font-size:11px;color:var(--muted);text-align:left;margin-top:3px;line-height:1.3}
.mini.x{color:var(--err)}
.row{display:flex;gap:8px;align-items:center}
.pxrow{display:grid;grid-template-columns:1fr 74px 64px 32px;gap:6px;margin-bottom:6px;align-items:center}
.pxrow .r{grid-column:1/-1;font-size:12px;color:var(--err);margin-top:-3px}
.gchk{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:14px;color:var(--ink)}
.gchk small{margin-left:auto}
.gchk.bad small{color:var(--err);font-weight:600}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin-bottom:4px}
#modal{position:fixed;inset:0;background:rgba(20,30,28,.45);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:30px 12px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h3{flex:1;margin:0;font-size:17px}
.mbody{padding:14px 16px}
.mfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2a27;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}
#toast.on{opacity:1}
#toast.err{background:var(--err)}
#login{max-width:360px;margin:60px auto;padding:0 16px}
#login .card{padding:22px}
.logo{font-size:26px;font-weight:700;color:var(--pri);text-align:center}
.sub{text-align:center;color:var(--muted);margin-bottom:18px}
.loading{text-align:center;padding:60px;color:var(--muted)}
.list-h{font-weight:700;margin:16px 0 6px}
.kv{font-size:13px;margin:2px 0}
.kv b{color:var(--muted);font-weight:600}
.ro input,.ro select,.ro textarea{background:#f7f8f7}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.side{display:grid;gap:12px;position:sticky;top:104px}
.side .card{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:8px 12px;align-items:start}
.cards .ex{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;padding:7px 14px}
.seg button.on{background:var(--pri);color:#fff}
.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:150px}
.mes td.c{min-width:40px;padding:3px 2px;text-align:center;border-left:1px solid var(--line)}
.mes td.c.ed{cursor:pointer}
.mes td.c.ed:hover{outline:2px solid var(--pri);outline-offset:-2px}
.mes th{padding:4px 2px;text-align:center;font-size:11px;line-height:1.2}
.mes th.fs,.mes td.fs{background:#f7f5ef}
.mes th.hoy,.mes td.hoy{background:#e6f3ef}
.mes .t{display:block;border-radius:5px;padding:5px 0;font-size:12px;font-weight:700}
.mes .n{display:block;font-size:10px;color:var(--muted)}
.tbl tr[data-a]{cursor:pointer}
.tbl tr[data-a]:hover td{background:#f5faf8}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;color:var(--pri)}
.stat small{font-size:12px}
.barra{height:8px;border-radius:4px;background:var(--pri);opacity:.7;min-width:2px}
.filtros{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 12px;align-items:end}
.checks{display:flex;flex-wrap:wrap;gap:4px 16px;margin:4px 0 12px}
.checks .chk{margin:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.rep h3{margin:18px 0 8px;font-size:16px}
.rep h1{font-size:20px;margin:0 0 4px;color:var(--pri)}
.sub2{color:var(--muted);margin:0 0 12px}
.rep .stats{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.rep table{margin-bottom:6px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}.side{position:static}}
@media (max-width:640px){
  .cards{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  main{padding:12px 12px 60px}
  header h1 span{display:none}
  .stat b{font-size:21px}
  .bar .grow{flex-basis:100%;height:0}
  .sticky1 td:first-child,.sticky1 th:first-child{min-width:110px}
}
@media print{
  @page{size:landscape;margin:8mm}
  .scroll{overflow:visible!important}
  table.mes td.c{min-width:0;padding:1px}
  table.mes .t{font-size:9px;padding:2px 0}
  #selbar{display:none!important}
  .cols{display:block}
  header,nav,.bar,button{display:none!important}
  body{background:#fff}
  .card,.ex{break-inside:avoid;border-color:#bbb}
}
</style>

<body>
<div id="app"><div class="loading">Cargando…</div></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<div id="selbar"></div>

<script>
/* ───────────── utilidades ───────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const hoy = () => iso(new Date());
const lunes = s => { const d = pd(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const DIASL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fCorta = s => { const d = pd(s); return DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
const fLarga = s => { const d = pd(s); return DIASL[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const toM = t => { if (!t) return null; const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const fromM = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const J = (s, def) => { if (s && typeof s === 'object') return s; try { return s ? JSON.parse(s) : def; } catch (e) { return def; } };
const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
const num = v => Number(String(v || '').replace(',', '.')) || 0;
const ESTADOS = ['Programada', 'Confirmada', 'Realizada', 'Cancelada'];
const normal = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();

function api(fn, ...args) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => {
      const msg = (e && e.message) || String(e);
      if (msg.indexOf('SESION') >= 0) { salirLocal(); rej(new Error('Tu sesión expiró. Vuelve a entrar.')); }
      else rej(new Error(msg));
    })[fn](...args);
  });
}
function toast(m, err) {
  const t = $('#toast'); t.textContent = m; t.className = 'on' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', err ? 4500 : 2200);
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};

/* ───────────── estado ───────────── */
const S = { sel: new Set(), fh: { q: '', desde: '', hasta: '', act: '', todos: false }, tok: store.get('anim_tk'), me: null, d: null, vista: 'dia', fecha: hoy(), semana: lunes(hoy()),
  fx: { desde: hoy(), hasta: addD(hoy(), 14), guia: '', estado: '', q: '', mias: true },
};
const esJefe = () => S.me && S.me.rol === 'jefe';

const T = n => S.d[n] || [];
const by = (n, id) => T(n).find(x => x.id === id);
const guia = id => by('Guias', id);
const act = ex => by('Actividades', ex.actividadId);
const nomAct = ex => (act(ex) || {}).nombre || '(actividad eliminada)';
const guiasActivas = () => T('Guias').filter(g => g.activo !== 'no');
const exGuias = ex => String(ex.guias || '').split(',').filter(Boolean);
const exPax = ex => J(ex.pasajeros, []).reduce((a, p) => a + (num(p.pax) || 0), 0);
const cfg = k => (T('Config').find(c => c.id === k) || {}).valor || '';

function finEx(ex) {
  if (ex.fin) return ex.fin;
  const a = act(ex); const s = toM(ex.inicio);
  return s == null ? '' : fromM(s + (num(a && a.duracion) || 60));
}
function rango(ex) {
  const s = toM(ex.inicio); let e = toM(finEx(ex));
  if (s == null) return null;
  if (e == null || e <= s) e = (e == null ? s + 60 : e + 1440);
  return [s, e];
}
function solapa(a, b) {
  if (a.fecha !== b.fecha) return false;
  const x = rango(a), y = rango(b);
  return !!(x && y && x[0] < y[1] && y[0] < x[1]);
}
function turnoDe(gid, fecha) {
  const t = T('Turnos').find(x => x.guiaId === gid && x.fecha === fecha);
  if (!t) return null;
  return Object.assign({}, t, { tipo: by('TiposTurno', t.tipoId) });
}
function txtTurno(tu) {
  if (!tu) return 'sin turno';
  if (!tu.tipo) return '(turno eliminado)';
  if (tu.tipo.esLibre === 'si') return tu.tipo.nombre.toUpperCase();
  return tu.tipo.nombre + (tu.tipo.inicio ? ' ' + tu.tipo.inicio + '–' + tu.tipo.fin : '');
}
function necesidad(list) {
  const out = {};
  list.forEach(ex => {
    const a = act(ex); if (!a) return;
    const imp = J(a.implementos, {}); const pax = exPax(ex);
    Object.keys(imp).forEach(k => { const n = Math.ceil(num(imp[k]) * pax); if (n) out[k] = (out[k] || 0) + n; });
  });
  return out;
}
const vivas = () => T('Excursiones').filter(e => e.estado !== 'Cancelada');
const exsDe = f => T('Excursiones').filter(e => e.fecha === f).sort((a, b) => (a.inicio || '').localeCompare(b.inicio || ''));

function alertas(ex) {
  const out = [];
  if (ex.estado === 'Cancelada' || !ex.fecha) return out;
  const a = act(ex);
  const otras = vivas().filter(o => o.id !== ex.id && solapa(o, ex));
  const gs = exGuias(ex);
  if (!gs.length && !(a && /arriendo/i.test(a.nombre))) out.push({ t: 'warn', m: 'Sin guía asignado' });
  gs.forEach(gid => {
    const g = guia(gid); const n = g ? g.nombre : '(guía eliminado)';
    const tu = turnoDe(gid, ex.fecha);
    if (!tu) out.push({ t: 'warn', m: n + ': no tiene turno asignado ese día' });
    else if (tu.tipo && tu.tipo.esLibre === 'si') out.push({ t: 'err', m: n + ' tiene ' + tu.tipo.nombre.toUpperCase() + ' ese día' });
    else if (tu.tipo && tu.tipo.inicio && tu.tipo.fin) {
      const r = rango(ex); let ts = toM(tu.tipo.inicio), te = toM(tu.tipo.fin); if (te <= ts) te += 1440;
      if (r && (r[0] < ts || r[1] > te)) out.push({ t: 'warn', m: n + ': fuera de su turno (' + tu.tipo.inicio + '–' + tu.tipo.fin + ')' });
    }
    otras.filter(o => exGuias(o).includes(gid)).forEach(o =>
      out.push({ t: 'err', m: n + ' ya está en ' + nomAct(o) + ' ' + o.inicio + '–' + finEx(o) }));
  });
  if (ex.recursoId) {
    const r = by('Recursos', ex.recursoId); const rn = r ? r.nombre : 'Recurso';
    otras.filter(o => o.recursoId === ex.recursoId).forEach(o =>
      out.push({ t: 'err', m: rn + ' ocupado en ' + nomAct(o) + ' ' + o.inicio + '–' + finEx(o) }));
    if (r && num(r.capacidad) && exPax(ex) > num(r.capacidad)) out.push({ t: 'err', m: exPax(ex) + ' pax supera la capacidad de ' + rn + ' (' + r.capacidad + ')' });
  }
  if (a && num(a.capacidad) && exPax(ex) > num(a.capacidad)) out.push({ t: 'warn', m: exPax(ex) + ' pax supera el máximo de la actividad (' + a.capacidad + ')' });
  const propia = necesidad([ex]);
  const total = necesidad([ex].concat(otras));
  Object.keys(propia).forEach(k => {
    const im = by('Implementos', k); if (!im) return;
    const stock = num(im.cantidad);
    if (total[k] > stock) out.push({ t: 'err', m: im.nombre + ': se necesitan ' + total[k] + (total[k] > propia[k] ? ' (sumando excursiones a la misma hora)' : '') + ' y hay ' + stock });

}

/** Reparte actividades simultáneas en columnas, lado a lado. */
function layoutDia(exs) {
  const it = exs.map(ex => { const r = rango(ex) || [540, 600]; return { ex, s: r[0], e: Math.max(r[1], r[0] + 30) }; })
    .sort((a, b) => a.s - b.s || b.e - a.e);
  const out = []; let grupo = [], fin = -1;
  const cerrar = () => {
    const cols = [];
    grupo.forEach(x => { let c = cols.findIndex(end => end <= x.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = x.e; x.col = c; });
    grupo.forEach(x => x.ncol = cols.length); out.push(...grupo); grupo = [];
  };
  it.forEach(x => { if (grupo.length && x.s >= fin) { cerrar(); fin = -1; } grupo.push(x); fin = Math.max(fin, x.e); });
  if (grupo.length) cerrar();

}
function vCal(modo) {
  const F = S.fx, base = S.cf || S.fecha;
  const dias = modo === 'dia' ? [base] : [...Array(7)].map((_, i) => addD(lunes(base), i));
  const gsel = !esJefe() && F.mias ? S.me.guiaId : F.guia;
  const exsDia = f => exsDe(f).filter(e => (!gsel || exGuias(e).includes(gsel)) && (!F.estado || (e.estado || 'Programada') === F.estado));
  const todos = dias.flatMap(exsDia).map(e => rango(e)).filter(Boolean);
  const h0 = Math.min(7 * 60, ...todos.map(r => Math.floor(r[0] / 60) * 60));
  const h1 = Math.max(22 * 60, ...todos.map(r => Math.ceil(Math.max(r[1], r[0] + 30) / 60) * 60));
  const alto = (h1 - h0) / 60 * PPH, h = hoy();
  const horas = []; for (let m = h0; m < h1; m += 60) horas.push(m);
  const ahora = new Date(), mAhora = ahora.getHours() * 60 + ahora.getMinutes();
  const anchos = [];
  const cols = dias.map(f => {
    const lay = layoutDia(exsDia(f));
    anchos.push(Math.min(3, Math.max(1, ...lay.map(x => x.ncol))));
    const burbujas = lay.map(x => {
      const e = x.ex, a = act(e) || {}, c = a.color || '#1f5f55';
      const al = alertas(e).some(y => y.t === 'err'), alt = (x.e - x.s) / 60 * PPH;
      const gs = exGuias(e).map(id => (guia(id) || {}).nombre || '?').join(', ');
      return `<div class="burb ${e.estado === 'Cancelada' ? 'cancel' : ''} ${al ? 'mal' : ''}" data-a="editar-ex" data-id="${esc(e.id)}"
        style="top:${(x.s - h0) / 60 * PPH + 1}px;height:${Math.max(alt - 3, 20)}px;left:calc(${x.col / x.ncol * 100}% + 2px);width:calc(${100 / x.ncol}% - 4px);border-left-color:${esc(c)};background:${esc(c)}1f"
        title="${esc(e.inicio + '–' + finEx(e) + ' ' + nomAct(e) + ' · ' + (gs || 'sin guía') + ' · ' + exPax(e) + ' pax')}">
        <b>${esc(nomAct(e))}</b><span>${esc(e.inicio)}–${esc(finEx(e))} · ${exPax(e)} pax</span>${alt > 56 ? `<span>👤 ${esc(gs || 'sin guía')}</span>` : ''}${al ? '<span class="x">⛔ conflicto</span>' : ''}</div>`;
    }).join('');
    const now = f === h && mAhora >= h0 && mAhora <= h1 ? `<div class="ahora" style="top:${(mAhora - h0) / 60 * PPH}px"></div>` : '';
    return `<div class="col ${f === h ? 'hoy' : ''}" data-a="cal-nueva" data-f="${f}" data-h0="${h0}">${burbujas}${now}</div>`;
  }).join('');
  const cab = dias.map(f => { const v = exsDia(f).filter(e => e.estado !== 'Cancelada');
    const tur = modo === 'dia' ? guiasActivas().map(g => { const tu = turnoDe(g.id, f); return tu && tu.tipo ? g.nombre + ': ' + (tu.tipo.esLibre === 'si' ? tu.tipo.nombre.toLowerCase() : tu.tipo.nombre + ' ' + (tu.tipo.inicio || '') + '–' + (tu.tipo.fin || '')) : ''; }).filter(Boolean).join(' · ') : '';
    return `<div class="dh ${f === h ? 'hoy' : ''}" ${modo === 'semana' ? `data-a="cal-dia" data-f="${f}"` : ''}><b>${esc(modo === 'dia' ? (tur ? 'Turnos' : fLarga(f)) : fCorta(f))}</b><small>${v.length} exc · ${v.reduce((a, e) => a + exPax(e), 0)} pax${tur ? ' · ' + esc(tur) : ''}</small></div>`; }).join('');
  const plantilla = modo === 'dia' ? '54px 1fr' : '54px ' + anchos.map(k => `minmax(${k * 125}px,${k}fr)`).join(' ');
  const titulo = modo === 'dia' ? fLarga(base) + (base === h ? ' · hoy' : '') : 'Semana del ' + fRango(dias[0], dias[6]);
  return `<div class="bar">${segExc(modo)}<button data-a="cal-mov" data-n="${modo === 'dia' ? -1 : -7}">‹</button><button data-a="cal-hoy">Hoy</button><button data-a="cal-mov" data-n="${modo === 'dia' ? 1 : 7}">›</button>
      <input type="date" value="${esc(base)}" data-a="cal-fecha" style="width:auto"><span class="grow"></span>${filtroGuia()}
      <select data-fx="estado" style="width:auto"><option value="">Todos los estados</option>${ESTADOS.map(x => `<option ${F.estado === x ? 'selected' : ''}>${x}</option>`).join('')}</select>

    <div class="cal ${modo}" id="cal" style="--pph:${PPH}px">
      <div class="cal-head" style="grid-template-columns:${plantilla}"><div class="gut"></div>${cab}</div>
      <div class="cal-body" style="height:${alto}px;grid-template-columns:${plantilla}"><div class="gut">${horas.map(m => `<span style="top:${(m - h0) / 60 * PPH}px">${fromM(m)}</span>`).join('')}</div>${cols}</div>
    </div>
    <p><small>Toca un espacio vacío del calendario para crear una excursión a esa hora. Las actividades que coinciden en horario se muestran lado a lado.</small></p>`;
}

async function borrar(tabla, btn) {
  if (!btn.classList.contains('sure')) { btn.classList.add('sure'); btn.textContent = '¿Seguro? Toca otra vez'; return; }
  const id = tabla === 'Excursiones' ? E.id : S.editId;
  try {
    await api('eliminar', S.tok, tabla, id);
    S.d[tabla] = S.d[tabla].filter(x => x.id !== id);
    if (tabla === 'Guias') S.d.Turnos = S.d.Turnos.filter(t => t.guiaId !== id);
    cerrar(); render(); toast('Eliminado');
  } catch (e) { toast(e.message, true); }
}

/* ───────────── textos para WhatsApp ───────────── */
function textoDia(f) {
  let t = `*Programa ${fLarga(f)}*\n\n*Turnos*\n`;
  guiasActivas().forEach(g => { const tu = turnoDe(g.id, f); t += `• ${g.nombre}: ${txtTurno(tu)}${tu && tu.nota ? ' (' + tu.nota + ')' : ''}\n`; });
  const exs = exsDe(f).filter(e => e.estado !== 'Cancelada');
  t += `\n*Excursiones* (${exs.length})\n`;
  exs.forEach(e => {
    const r = e.recursoId && by('Recursos', e.recursoId);
    t += `\n▶ ${e.inicio}–${finEx(e)} *${nomAct(e)}*\n   Guía: ${exGuias(e).map(id => (guia(id) || {}).nombre || '?').join(', ') || 'SIN GUÍA'}${r ? ' · ' + r.nombre : ''}\n   ${exPax(e)} pax: ${J(e.pasajeros, []).map(p => paxNombre(p) + (num(p.pax) > 1 ? ' ×' + p.pax : '')).join(', ') || '-'}\n`;
    restricciones(e).forEach(x => t += `   ⚠️ ${x}\n`);
    if (e.notas) t += `   📝 ${e.notas}\n`;
  });
  if (!exs.length) t += 'Sin excursiones programadas.\n';
  return t;
}
function textoSemana(L) {
  let t = `*Turnos semana del ${fLarga(L)}*\n`;
  guiasActivas().forEach(g => {
    t += `\n*${g.nombre}*\n`;
    [...Array(7)].forEach((_, i) => { const f = addD(L, i), tu = turnoDe(g.id, f); t += `${fCorta(f)}: ${txtTurno(tu)}${tu && tu.nota ? ' (' + tu.nota + ')' : ''}\n`; });
  });
  return t;
}
function modalTexto(titulo, txt) {
  modal(titulo, `<textarea id="wtxt" rows="16" style="font-size:13px">${esc(txt)}</textarea>`,
    `<a class="grow" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener"><button>Abrir WhatsApp</button></a>
     <button data-a="cerrar">Cerrar</button><button class="pri" data-a="copiar-txt">Copiar</button>`);
}
function copiarTxt() {
  const ta = $('#wtxt'); ta.select();
  const ok = () => toast('Copiado. Pégalo en WhatsApp.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, () => { document.execCommand('copy'); ok(); });
  else { document.execCommand('copy'); ok(); }
}

/* ───────────── modal genérico ───────────── */
function modal(titulo, cuerpo, pie) {
  $('#mbox').innerHTML = `<div class="mhead"><h3>${esc(titulo)}</h3><button class="sm" data-a="cerrar">✕</button></div>
    <div class="mbody">${cuerpo}</div><div class="mfoot">${pie || ''}</div>`;
  $('#modal').classList.add('on');
  const first = $('#mbox .mbody input:not([type=hidden]):not([type=checkbox]),#mbox .mbody select');
  if (first && window.innerWidth > 700) first.focus();
}
function cerrar() { $('#modal').classList.remove('on'); $('#mbox').innerHTML = ''; E = null; }

/* ───────────── eventos ───────────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const a = el.dataset.a, id = el.dataset.id;
  const acciones = {
    'vista': () => { S.vista = el.dataset.v; S.sel = new Set(); S.selModo = false; render(); window.scrollTo(0, 0); },
    'recargar': () => recargar(),
    'salir': () => { api('salir', S.tok).catch(() => {}); salirLocal(); pantallaLogin(); },
    'dia-mov': () => { S.fecha = addD(S.fecha, +el.dataset.n); render(); },
    'dia-hoy': () => { S.fecha = hoy(); render(); },
    'ir-dia': () => { S.fecha = el.dataset.f; S.vista = 'dia'; render(); },
    'sem-mov': () => { S.sel = new Set(); S.semana = addD(S.semana, +el.dataset.n); render(); },
    'sem-hoy': () => { S.semana = lunes(hoy()); render(); },
    'sel-modo': () => { S.selModo = !S.selModo; if (!S.selModo) S.sel = new Set(); render(); },
    'sel-aplicar': () => aplicarSel(el.dataset.t),
    'sel-limpiar': () => { S.sel = new Set(); S.selModo = false; render(); },
    'pdf-turnos': () => pdfTurnos(el),
    'xmodo': () => { S.xmodo = el.dataset.m; render(); calScroll(true); },
    'cal-mov': () => { S.cf = addD(S.cf || S.fecha, +el.dataset.n); render(); calScroll(true); },
    'cal-hoy': () => { S.cf = hoy(); render(); calScroll(true); },
    'cal-dia': () => { S.cf = el.dataset.f; S.xmodo = 'dia'; render(); calScroll(true); },
    'cal-nueva': () => {
      const y = e.clientY - el.getBoundingClientRect().top;
      const m = Math.round((+el.dataset.h0 + y / PPH * 60) / 30) * 30;
      nuevaEx(el.dataset.f); const ini = $('#mbox [name="inicio"]'); if (ini) { ini.value = fromM(Math.min(m, 23 * 60 + 30)); exLeer(); }
    },
    'set-turno': () => setTurno(el.dataset.t),
    'copiar-semana-ant': () => copiarSemanaAnterior(),
    'copiar-dia': () => modalTexto('Programa del día', textoDia(S.fecha)),
    'copiar-semana': () => modalTexto('Turnos de la semana', textoSemana(S.semana)),
    'copiar-txt': () => copiarTxt(),
    'imprimir': () => window.print(),
    'nueva-ex': () => nuevaEx(S.vista === 'dia' ? S.fecha : ''),
    'editar-ex': () => abrirEx(by('Excursiones', id)),
    'guardar-ex': () => guardarEx(),
    'duplicar-ex': () => { exLeer(); const c = Object.assign({}, E, { id: '', estado: 'Programada', checklist: '[]', actualizado: '', actualizadoPor: '' }); abrirEx(c); toast('Copia creada: cambia la fecha o la hora y guarda'); },
    'px-add': () => { exLeer(); E._pax.push({ h: '', nombre: '', pax: 1 }); exPartes(); const ins = $('#expax').querySelectorAll('[data-pf="n"]'); ins[ins.length - 1].focus(); },
    'px-del': () => { exLeer(); E._pax.splice(+el.dataset.i, 1); exPartes(); },
    'ver-ex': () => { const ex = by('Excursiones', id); cerrar(); if (ex) abrirEx(ex); },
    'editar-hues': () => abrirHues(by('Huespedes', id)),
    'nueva-act': () => abrirAct(),
    'editar-act': () => abrirAct(by('Actividades', id)),
    'nuevo-imp': () => abrirImp(), 'editar-imp': () => abrirImp(by('Implementos', id)),
    'nuevo-rec': () => abrirRec(), 'editar-rec': () => abrirRec(by('Recursos', id)),
    'nuevo-guia': () => abrirGuia(), 'editar-guia': () => abrirGuia(by('Guias', id)),
    'nuevo-tipo': () => abrirTipo(), 'editar-tipo': () => abrirTipo(by('TiposTurno', id)),
    'guardar-form': () => {
      const f = $('#f'); if (!f.reportValidity()) return;
      guardarObj(el.dataset.t, leerForm());
    },
    'borrar': () => borrar(el.dataset.t, el),
    'guardar-cfg': async () => {
      try {
        await api('guardarConfig', S.tok, 'LODGE', $('#cfg-lodge').value);
        const c = T('Config').find(x => x.id === 'LODGE'); if (c) c.valor = $('#cfg-lodge').value.trim(); else S.d.Config.push({ id: 'LODGE', valor: $('#cfg-lodge').value.trim() });
        render(); toast('Configuración guardada');
      } catch (err) { toast(err.message, true); }
    },
    'inf-preset': () => { presetInforme(el.dataset.k); render(); },
    'inf-pdf': () => generarPdf(el),
    'tmodo': () => { S.sel = new Set(); S.tmodo = el.dataset.m; if (el.dataset.m === 'mes' && !S.mes) S.mes = S.semana.slice(0, 7); render(); },
    'mes-mov': () => { S.sel = new Set(); const [y, m] = (S.mes || hoy().slice(0, 7)).split('-').map(Number); const d = new Date(y, m - 1 + +el.dataset.n, 1); S.mes = iso(d).slice(0, 7); render(); },
    'mes-hoy': () => { S.mes = hoy().slice(0, 7); render(); },
    'copiar-mes': () => modalTexto('Turnos del mes', textoMes(S.mes || hoy().slice(0, 7))),
    'cerrar': () => cerrar()
  };
  if (acciones[a]) { e.preventDefault(); acciones[a](); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.a === 'dia-fecha' && el.value) { S.fecha = el.value; render(); return; }
  if (el.dataset.a === 'cal-fecha' && el.value) { S.cf = el.value; render(); calScroll(true); return; }
  if (el.dataset.fi) { S.fi[el.dataset.fi] = el.type === 'checkbox' ? el.checked : el.value; render(); return; }
  if (el.dataset.fs) { S.fi.sec[el.dataset.fs] = el.checked; render(); return; }
  if (el.dataset.fx) { S.fx[el.dataset.fx] = el.type === 'checkbox' ? el.checked : el.value; render(); return; }
  if (el.dataset.fh && el.dataset.fh !== 'q') { S.fh[el.dataset.fh] = el.type === 'checkbox' ? el.checked : el.value; render(); return; }
  if (E && $('#exinfo') && el.closest('#mbox')) exCambio(el);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.fx === 'q' || el.dataset.fh === 'q') {
    clearTimeout(S._q); S._q = setTimeout(() => {
      if (el.dataset.fx) S.fx.q = el.value; else S.fh.q = el.value;
      render(); const n = document.querySelector(el.dataset.fx ? '[data-fx="q"]' : '[data-fh="q"]'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 250);
  }
  if (E && $('#exinfo') && el.dataset.pf === 'pax') { exLeer(); refrescarExSinPax(); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') cerrar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('on')) cerrar(); });
// trae cambios de los demás cada 5 minutos (si no estás editando)
setInterval(() => { if (S.tok && S.d && !$('#modal').classList.contains('on') && !document.hidden) recargar(true); }, 5 * 60 * 1000);

boot();
</script>
